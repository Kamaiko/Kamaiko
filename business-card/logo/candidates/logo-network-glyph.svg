<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Accent gradient cyan -> blue. Purely decorative: the mark stays fully legible
         in flat mono (see cells B & C, which redraw it single-colour). -->
    <linearGradient id="ngEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <!--
      ===== MASTER SYMBOL : "network-glyph" =====
      Drawn once around local origin (0,0) = empty centre.
      Geometry: 6 nodes on a point-up hexagon (radius 88), giving a
      symmetric, memorable silhouette. Edges = the 6 hexagon sides
      (the contour / system boundary) + the 3 long diagonals that cross
      at the centre (the neural mesh / decentralised topology). No node
      sits at the centre: the crossing reads as a distributed network,
      not a hierarchy. Vertical-axis mirror symmetry is exact.
      The TOP node is the single cyan accent (the "active" node / signal).

      Hexagon vertices (computed):
        top         (   0, -88)
        upper-right (  76, -44)
        lower-right (  76,  44)
        bottom      (   0,  88)
        lower-left  ( -76,  44)
        upper-left  ( -76, -44)
    -->
    <g id="ng">
      <!-- Edges: outer hexagon contour + 3 inner diagonals. Thin, crisp, uncapped joins. -->
      <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <!-- contour -->
        <path d="M0 -88 L76 -44 L76 44 L0 88 L-76 44 L-76 -44 Z"/>
        <!-- diagonals (cross at centre) -->
        <path d="M0 -88 L0 88"/>
        <path d="M-76 -44 L76 44"/>
        <path d="M76 -44 L-76 44"/>
      </g>

      <!-- Five "structure" nodes — filled dark-on-light / light-on-dark via overlays per cell -->
      <g class="ng-nodes">
        <circle cx="76"  cy="-44" r="13"/>
        <circle cx="76"  cy="44"  r="13"/>
        <circle cx="0"   cy="88"  r="13"/>
        <circle cx="-76" cy="44"  r="13"/>
        <circle cx="-76" cy="-44" r="13"/>
      </g>
    </g>
  </defs>

  <!-- ============ CELL A — dark background ============ -->
  <rect x="0" y="0" width="400" height="400" fill="#0A0E1A"/>
  <g transform="translate(200,185)">
    <use href="#ng" stroke="url(#ngEdge)"/>
    <!-- base nodes in soft light -->
    <g fill="#E8EEF5">
      <circle cx="76"  cy="-44" r="13"/>
      <circle cx="76"  cy="44"  r="13"/>
      <circle cx="0"   cy="88"  r="13"/>
      <circle cx="-76" cy="44"  r="13"/>
      <circle cx="-76" cy="-44" r="13"/>
    </g>
    <!-- accent node (top) : cyan with dark core -->
    <circle cx="0" cy="-88" r="16" fill="#22D3EE"/>
    <circle cx="0" cy="-88" r="6"  fill="#0A0E1A"/>
  </g>

  <!-- ============ CELL B — light background (same symbol, dark redraw) ============ -->
  <rect x="400" y="0" width="400" height="400" fill="#E8EEF5"/>
  <g transform="translate(600,185)">
    <use href="#ng" stroke="#0A0E1A"/>
    <g fill="#0A0E1A">
      <circle cx="76"  cy="-44" r="13"/>
      <circle cx="76"  cy="44"  r="13"/>
      <circle cx="0"   cy="88"  r="13"/>
      <circle cx="-76" cy="44"  r="13"/>
      <circle cx="-76" cy="-44" r="13"/>
    </g>
    <!-- accent node kept cyan to carry the brand colour on light -->
    <circle cx="0" cy="-88" r="16" fill="#22D3EE"/>
    <circle cx="0" cy="-88" r="6"  fill="#E8EEF5"/>
  </g>

  <!-- ============ CELL C — lockup ============ -->
  <rect x="800" y="0" width="400" height="400" fill="#0A0E1A"/>
  <!-- small symbol (~84px tall): master spans ~176px (-88..88), scale ~0.42 -> ~74px;
       nudge to 0.46 for ~84px presence at left. -->
  <g transform="translate(840,150) scale(0.46)">
    <use href="#ng" stroke="url(#ngEdge)"/>
    <g fill="#E8EEF5">
      <circle cx="76"  cy="-44" r="13"/>
      <circle cx="76"  cy="44"  r="13"/>
      <circle cx="0"   cy="88"  r="13"/>
      <circle cx="-76" cy="44"  r="13"/>
      <circle cx="-76" cy="-44" r="13"/>
    </g>
    <circle cx="0" cy="-88" r="16" fill="#22D3EE"/>
    <circle cx="0" cy="-88" r="6"  fill="#0A0E1A"/>
  </g>
  <text x="892" y="160" fill="#E8EEF5" font-size="34" font-weight="700">Patrick Patenaude</text>
  <text x="893" y="192" fill="#8E9BB0" font-size="15" letter-spacing="2">DÉVELOPPEUR WEB / MOBILE</text>

  <!-- ============ Legend ============ -->
  <text x="20" y="384" fill="#8E9BB0" font-size="17">network-glyph — réseau neuronal + systèmes</text>
</svg>
