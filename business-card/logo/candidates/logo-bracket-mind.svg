<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <!-- ============================================================
       bracket-mind — code encadrant l'esprit
       Symbole : chevrons < > encadrant une mini-constellation.
       Construit une fois dans <defs>, instancié 3 fois.
       Repère interne : symbole dessiné centré sur (0,0),
       emprise utile ~ -100..100 (≈200x200).
       ============================================================ -->
  <defs>
    <linearGradient id="bm-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- =========== SYMBOLE, version sur fond SOMBRE =========== -->
    <g id="sym-dark">
      <!-- Chevron gauche -->
      <path d="M -52 -64 L -94 0 L -52 64"
            fill="none" stroke="#E8EEF5" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Chevron droit -->
      <path d="M 52 -64 L 94 0 L 52 64"
            fill="none" stroke="#E8EEF5" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Constellation : liens (sous les noeuds) -->
      <g stroke="url(#bm-accent)" stroke-width="3.4" stroke-linecap="round" opacity="0.85">
        <line x1="0"   y1="-46" x2="-30" y2="-2"/>
        <line x1="0"   y1="-46" x2="30"  y2="-6"/>
        <line x1="-30" y1="-2"  x2="6"   y2="40"/>
        <line x1="30"  y1="-6"  x2="6"   y2="40"/>
        <line x1="-30" y1="-2"  x2="30"  y2="-6"/>
      </g>
      <!-- Constellation : noeuds -->
      <g>
        <circle cx="0"   cy="-46" r="8.5" fill="#22D3EE"/>
        <circle cx="-30" cy="-2"  r="6.5" fill="#E8EEF5"/>
        <circle cx="30"  cy="-6"  r="6.5" fill="#E8EEF5"/>
        <circle cx="6"   cy="40"  r="9.5" fill="#3B82F6"/>
      </g>
    </g>

    <!-- =========== SYMBOLE, version sur fond CLAIR =========== -->
    <g id="sym-light">
      <path d="M -52 -64 L -94 0 L -52 64"
            fill="none" stroke="#0A0E1A" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 52 -64 L 94 0 L 52 64"
            fill="none" stroke="#0A0E1A" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>

      <g stroke="#0A0E1A" stroke-width="3.4" stroke-linecap="round" opacity="0.55">
        <line x1="0"   y1="-46" x2="-30" y2="-2"/>
        <line x1="0"   y1="-46" x2="30"  y2="-6"/>
        <line x1="-30" y1="-2"  x2="6"   y2="40"/>
        <line x1="30"  y1="-6"  x2="6"   y2="40"/>
        <line x1="-30" y1="-2"  x2="30"  y2="-6"/>
      </g>
      <g>
        <circle cx="0"   cy="-46" r="8.5" fill="#0891B2"/>
        <circle cx="-30" cy="-2"  r="6.5" fill="#0A0E1A"/>
        <circle cx="30"  cy="-6"  r="6.5" fill="#0A0E1A"/>
        <circle cx="6"   cy="40"  r="9.5" fill="#2563EB"/>
      </g>
    </g>
  </defs>

  <!-- ============================ CELLULE A : symbole sur sombre ============================ -->
  <rect x="0" y="0" width="400" height="400" fill="#0A0E1A"/>
  <use href="#sym-dark" transform="translate(200 185) scale(1.05)"/>

  <!-- ============================ CELLULE B : symbole sur clair ============================ -->
  <rect x="400" y="0" width="400" height="400" fill="#E8EEF5"/>
  <use href="#sym-light" transform="translate(600 185) scale(1.05)"/>

  <!-- ============================ CELLULE C : lockup horizontal ============================ -->
  <rect x="800" y="0" width="400" height="400" fill="#0A0E1A"/>
  <use href="#sym-dark" transform="translate(840 150) scale(0.42)"/>
  <text x="892" y="160" fill="#E8EEF5" font-size="34" font-weight="700" letter-spacing="0.2">Patrick Patenaude</text>
  <text x="893" y="188" fill="#8E9BB0" font-size="15" font-weight="500" letter-spacing="2">DÉVELOPPEUR WEB / MOBILE</text>

  <!-- ============================ LÉGENDE ============================ -->
  <text x="20" y="384" fill="#8E9BB0" font-size="17">bracket-mind — code encadrant l'esprit</text>
</svg>
