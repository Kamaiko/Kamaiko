<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Subtle accent gradient: cyan -> blue. Logo stays legible without it (see B & C strokes). -->
    <linearGradient id="synEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <!--
      ===== MASTER SYMBOL =====
      Drawn once around a local origin (0,0) = central node.
      Geometry: a central filled node ("soma" = neuron body AND graph node),
      5 dendrites/edges radiating to small node-points. The top-right edge
      terminates in a code caret/chevron ">" instead of a dot.
      Stroke-driven so it scales + recolors cleanly; readable in pure mono.
    -->
    <g id="syn">
      <!-- Edges (dendrites / graph arcs). Slight curve gives an organic, synaptic feel. -->
      <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 0 C -34 -30 -58 -50 -76 -68"/>            <!-- to upper-left node -->
        <path d="M0 0 C -38 14 -64 26 -90 30"/>               <!-- to left node -->
        <path d="M0 0 C -18 38 -30 58 -38 82"/>               <!-- to lower-left node -->
        <path d="M0 0 C 24 36 40 56 52 78"/>                  <!-- to lower-right node -->
        <path d="M0 0 C 40 -22 64 -38 84 -52"/>               <!-- to code caret (top-right) -->
      </g>

      <!-- Satellite node-points (hollow rings read as graph nodes + receptors) -->
      <g fill="none" stroke-width="8">
        <circle cx="-76" cy="-68" r="11"/>
        <circle cx="-90" cy="30"  r="9"/>
        <circle cx="-38" cy="82"  r="9"/>
        <circle cx="52"  cy="78"  r="11"/>
      </g>

      <!-- Code accent: caret / chevron ">" closing the top-right dendrite -->
      <path d="M78 -68 L102 -52 L78 -36" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Central node (soma / hub) — filled, the anchor of the mark -->
      <circle cx="0" cy="0" r="20" stroke-width="0"/>
      <!-- Inner punch keeps the hub crisp at 16px and hints at a synaptic core -->
      <circle cx="0" cy="0" r="7" class="syn-core"/>
    </g>
  </defs>

  <!-- ============ CELL A — dark background ============ -->
  <rect x="0" y="0" width="400" height="400" fill="#0A0E1A"/>
  <g transform="translate(200,185)">
    <use href="#syn" stroke="url(#synEdge)"/>
    <!-- recolor specific parts via overlay so it reads in cyan/white -->
    <g transform="translate(0,0)">
      <circle cx="0" cy="0" r="20" fill="#22D3EE"/>
      <circle cx="0" cy="0" r="7"  fill="#0A0E1A"/>
    </g>
  </g>

  <!-- ============ CELL B — light background (same symbol, dark redraw) ============ -->
  <rect x="400" y="0" width="400" height="400" fill="#E8EEF5"/>
  <g transform="translate(600,185)">
    <use href="#syn" stroke="#0A0E1A"/>
    <circle cx="0" cy="0" r="20" fill="#0A0E1A"/>
    <circle cx="0" cy="0" r="7"  fill="#E8EEF5"/>
    <!-- code caret picked out in cyan to keep brand accent on light -->
    <path d="M78 -68 L102 -52 L78 -36" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ CELL C — lockup ============ -->
  <rect x="800" y="0" width="400" height="400" fill="#0A0E1A"/>
  <!-- small symbol (~84px tall), scaled from the 200px master (scale ~0.42) -->
  <g transform="translate(840,150) scale(0.42)">
    <use href="#syn" stroke="url(#synEdge)"/>
    <circle cx="0" cy="0" r="20" fill="#22D3EE"/>
    <circle cx="0" cy="0" r="7"  fill="#0A0E1A"/>
  </g>
  <text x="892" y="160" fill="#E8EEF5" font-size="34" font-weight="700">Patrick Patenaude</text>
  <text x="893" y="192" fill="#8E9BB0" font-size="15" letter-spacing="2">DÉVELOPPEUR WEB / MOBILE</text>

  <!-- ============ Legend ============ -->
  <text x="20" y="384" fill="#8E9BB0" font-size="17">synapse — neurone + nœud de graphe</text>
</svg>
