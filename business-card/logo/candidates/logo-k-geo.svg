<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- ===================== CELL A : K blanc sur fond sombre ===================== -->
  <rect x="0" y="0" width="400" height="400" fill="#0A0E1A"/>
  <!-- K géométrique centré ~(200,185), boîte ~200x200 (x 116..284, y 85..285), trait 36, pivot (152,185) -->
  <g fill="#E8EEF5">
    <!-- tige verticale -->
    <rect x="116" y="85" width="36" height="200"/>
    <!-- diagonale haute : pivot (152,185) -> coin (284,85), trait 36 -->
    <polygon points="148,167 268,85 290,107 170,189"/>
    <!-- diagonale basse : pivot (152,185) -> coin (284,285), trait 36 -->
    <polygon points="170,181 290,263 268,285 148,203"/>
  </g>
  <!-- noeud d'accent cyan au point de jonction des trois traits (152,185) -->
  <circle cx="152" cy="185" r="16" fill="#22D3EE"/>

  <!-- ===================== CELL B : K sombre sur fond clair ===================== -->
  <rect x="400" y="0" width="400" height="400" fill="#E8EEF5"/>
  <!-- même K, translaté de +400 en x : pivot (552,185) -->
  <g fill="#0A0E1A">
    <rect x="516" y="85" width="36" height="200"/>
    <polygon points="548,167 668,85 690,107 570,189"/>
    <polygon points="570,181 690,263 668,285 548,203"/>
  </g>
  <circle cx="552" cy="185" r="16" fill="#22D3EE"/>

  <!-- ===================== CELL C : lockup horizontal ===================== -->
  <rect x="800" y="0" width="400" height="400" fill="#0A0E1A"/>
  <!-- petit K (~84px) a gauche ~(840,150). Boite 84x84 : x 840..924, y 108..192, trait 15, pivot (855,150) -->
  <g fill="#E8EEF5">
    <rect x="840" y="108" width="15" height="84"/>
    <polygon points="852,142 902,108 911,121 861,155"/>
    <polygon points="861,145 911,179 902,192 852,158"/>
  </g>
  <circle cx="855" cy="150" r="7" fill="#22D3EE"/>
  <!-- texte lockup -->
  <text x="948" y="160" fill="#E8EEF5" font-size="34" font-weight="700">Patrick Patenaude</text>
  <text x="950" y="190" fill="#8E9BB0" font-size="15" letter-spacing="2">DÉVELOPPEUR WEB / MOBILE</text>

  <!-- ===================== Légende ===================== -->
  <text x="20" y="384" fill="#8E9BB0" font-size="17">k-geo — monogramme Kamaiko géométrique</text>
</svg>
