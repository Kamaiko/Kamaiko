<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 675" width="1125" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="1125" height="675" fill="#0A0E1A"/>
  <ellipse cx="250" cy="240" rx="560" ry="420" fill="url(#glow)"/>

  <!-- ===== TOP RULE + EN-TÊTE ÉDITORIAL ===== -->
  <!-- Filet supérieur plein cadre (zone sûre) -->
  <line x1="75" y1="120" x2="1050" y2="120" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Logo placeholder, calé à gauche au-dessus du filet -->
  <g id="logo-placeholder" transform="translate(75,52) scale(0.58)">
    <line x1="20" y1="78" x2="80" y2="78" stroke="#22D3EE" stroke-width="4"/>
    <line x1="20" y1="78" x2="50" y2="22" stroke="#22D3EE" stroke-width="4"/>
    <line x1="80" y1="78" x2="50" y2="22" stroke="#22D3EE" stroke-width="4"/>
    <circle cx="50" cy="22" r="9" fill="#22D3EE"/>
    <circle cx="20" cy="78" r="7" fill="#E8EEF5"/>
    <circle cx="80" cy="78" r="7" fill="#E8EEF5"/>
  </g>

  <!-- Kicker : petites capitales espacées, calé sur la ligne du logo -->
  <text x="150" y="100" font-size="16" font-weight="600" letter-spacing="6.5" fill="#8E9BB0">FULLSTACK DEVELOPER</text>

  <!-- Numéro d'index discret, aligné à droite sur le filet -->
  <text x="1050" y="100" font-size="15" font-weight="500" letter-spacing="4" fill="#8E9BB0" text-anchor="end">N<tspan baseline-shift="super" font-size="10">o</tspan> 01 <tspan fill="#22D3EE">/</tspan> 24</text>

  <!-- ===== BLOC NOM ===== -->
  <!-- Grande typo maîtrisée, deux lignes, interlignage serré -->
  <text x="73" y="300" font-size="92" font-weight="800" letter-spacing="1" fill="#E8EEF5">Patrick</text>
  <text x="73" y="392" font-size="92" font-weight="800" letter-spacing="1" fill="url(#nameGrad)">Patenaude</text>

  <!-- ===== TITRE + FILET DE SÉPARATION ===== -->
  <!-- Petit filet d'accent court -->
  <rect x="75" y="438" width="56" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="146" y="448" font-size="22" font-weight="600" letter-spacing="3" fill="#E8EEF5">Développeur Web / Mobile <tspan fill="#22D3EE">Fullstack</tspan></text>

  <!-- ===== TAGLINE SIGNATURE (accent éditorial) ===== -->
  <!-- Filet inférieur + tagline en italique, façon citation de magazine -->
  <line x1="75" y1="560" x2="1050" y2="560" stroke="#E8EEF5" stroke-width="1" stroke-opacity="0.10"/>

  <!-- Guillemet typographique d'accent -->
  <text x="75" y="612" font-size="58" font-weight="800" fill="#22D3EE" fill-opacity="0.30">&#8220;</text>
  <text x="118" y="600" font-size="26" font-style="italic" font-weight="500" letter-spacing="0.3" fill="#E8EEF5">Humans are harder to debug<tspan fill="#22D3EE" font-style="normal">.</tspan></text>

  <!-- Marque de pied, aligné à droite, discret -->
  <text x="1050" y="600" font-size="14" font-weight="500" letter-spacing="2.5" fill="#8E9BB0" text-anchor="end">PSYCHO &#8594; INFO</text>
</svg>
