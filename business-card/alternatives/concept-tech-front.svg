<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 675" width="1125" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- micro-grille de points tres subtile -->
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#E8EEF5" fill-opacity="0.045"/>
    </pattern>
    <!-- fondu pour estomper le decor mono vers la gauche -->
    <linearGradient id="decorFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0E1A" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#0A0E1A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0E1A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ===================== FOND ===================== -->
  <rect width="1125" height="675" fill="#0A0E1A"/>
  <ellipse cx="285" cy="305" rx="540" ry="400" fill="url(#glow)"/>
  <ellipse cx="1010" cy="150" rx="380" ry="300" fill="url(#glowBlue)"/>
  <rect width="1125" height="675" fill="url(#dots)"/>

  <!-- ===================== DECOR TECH (droite, deborde discretement) ===================== -->
  <g>
    <!-- glyphes monospace ghost, gros et tenus -->
    <g font-family="'Consolas','Courier New',monospace" font-weight="700">
      <text x="1058" y="150" font-size="118" fill="#22D3EE" fill-opacity="0.06" text-anchor="middle">&lt;/&gt;</text>
      <text x="1052" y="540" font-size="92" fill="#E8EEF5" fill-opacity="0.045" text-anchor="middle">{ }</text>
    </g>

    <!-- arcs concentriques, coin haut-droit (signature du banner) -->
    <g fill="none" stroke="#22D3EE">
      <path d="M1055 75 A70 70 0 0 1 1125 145" stroke-opacity="0.14" stroke-width="1.5"/>
      <path d="M1010 75 A115 115 0 0 1 1125 190" stroke-opacity="0.09" stroke-width="1.5"/>
      <path d="M965 75 A160 160 0 0 1 1125 235" stroke-opacity="0.055" stroke-width="1.5"/>
    </g>

    <!-- petites croix (x) dans les vides du coin droit -->
    <g fill="#22D3EE" font-family="'Consolas','Courier New',monospace" font-weight="700" font-size="20" fill-opacity="0.26">
      <text x="905" y="120">&#215;</text>
      <text x="978" y="300">&#215;</text>
      <text x="1062" y="248">&#215;</text>
      <text x="918" y="430">&#215;</text>
      <text x="1028" y="470">&#215;</text>
    </g>

    <!-- anneaux evides tenus -->
    <g fill="none" stroke="#22D3EE" stroke-opacity="0.34" stroke-width="1.5">
      <circle cx="942" cy="200" r="3"/>
      <circle cx="1042" cy="170" r="2.4"/>
      <circle cx="900" cy="318" r="2.6"/>
      <circle cx="1000" cy="392" r="2.8"/>
      <circle cx="960" cy="512" r="2.4"/>
    </g>
    <g fill="#3B82F6" fill-opacity="0.5">
      <circle cx="1006" cy="118" r="2.4"/>
      <circle cx="876" cy="244" r="2"/>
    </g>
  </g>

  <!-- voile de fondu : le decor reste discret, jamais sur la typo -->
  <rect x="640" y="0" width="485" height="675" fill="url(#decorFade)"/>

  <!-- ===================== EN-TETE : LOGO + INDEX MONO ===================== -->
  <!-- Logo placeholder, cale a gauche -->
  <g id="logo-placeholder" transform="translate(75,86) scale(0.62)">
    <line x1="20" y1="78" x2="80" y2="78" stroke="#22D3EE" stroke-width="4"/>
    <line x1="20" y1="78" x2="50" y2="22" stroke="#22D3EE" stroke-width="4"/>
    <line x1="80" y1="78" x2="50" y2="22" stroke="#22D3EE" stroke-width="4"/>
    <circle cx="50" cy="22" r="9" fill="#22D3EE"/>
    <circle cx="20" cy="78" r="7" fill="#E8EEF5"/>
    <circle cx="80" cy="78" r="7" fill="#E8EEF5"/>
  </g>

  <!-- chemin de terminal, aligne sur le logo : signale le metier sans surcharger -->
  <text x="148" y="138" font-family="'Consolas','Courier New',monospace" font-size="18" font-weight="600" letter-spacing="1" fill="#8E9BB0">~/patrick <tspan fill="#22D3EE">$</tspan></text>

  <!-- ===================== BLOC NOM (commande tapee dans le terminal) ===================== -->
  <text x="73" y="312" font-size="86" font-weight="800" letter-spacing="1.5" fill="#E8EEF5">PATRICK</text>
  <text x="73" y="404" font-size="86" font-weight="800" letter-spacing="1.5" fill="url(#nameGrad)">PATENAUDE</text>
  <!-- curseur de terminal stylise, en bout de nom -->
  <rect x="592" y="362" width="26" height="50" rx="2" fill="#22D3EE" fill-opacity="0.9"/>

  <!-- ===================== TITRE ===================== -->
  <rect x="75" y="446" width="54" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="146" y="456" font-size="22" font-weight="600" letter-spacing="3" fill="#E8EEF5">D&#233;veloppeur Web / Mobile <tspan fill="#22D3EE" font-weight="700">Fullstack</tspan></text>

  <!-- ===================== TAGLINE STYLE COMMENTAIRE DE CODE ===================== -->
  <line x1="75" y1="556" x2="1050" y2="556" stroke="#E8EEF5" stroke-width="1" stroke-opacity="0.09"/>
  <text x="75" y="600" font-family="'Consolas','Courier New',monospace" font-size="22" font-weight="500" letter-spacing="0.4" fill="#8E9BB0"><tspan fill="#22D3EE" fill-opacity="0.85">//</tspan> Humans are harder to debug</text>

  <!-- ancrage parcours, discret a droite -->
  <text x="1050" y="600" font-family="'Consolas','Courier New',monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#8E9BB0" fill-opacity="0.85" text-anchor="end">psycho <tspan fill="#22D3EE">&#8594;</tspan> info</text>
</svg>
