    <!-- plaque claire -->
    <rect x="0" y="0" width="200" height="200" rx="16" fill="#E8EEF5"/>
    <!-- trame grossière de modules QR (#0A0E1A) : grille ~7/ligne -->
    <g fill="#0A0E1A">
      <!-- coin haut-gauche (finder) -->
      <rect x="20" y="20" width="48" height="48" rx="4"/>
      <rect x="30" y="30" width="28" height="28" rx="2" fill="#E8EEF5"/>
      <rect x="37" y="37" width="14" height="14" rx="1"/>
      <!-- coin haut-droit (finder) -->
      <rect x="132" y="20" width="48" height="48" rx="4"/>
      <rect x="142" y="30" width="28" height="28" rx="2" fill="#E8EEF5"/>
      <rect x="149" y="37" width="14" height="14" rx="1"/>
