  <!-- ===================== EN-TÊTE : nom + filet ===================== -->
  <text x="75" y="158" font-size="40" font-weight="800" letter-spacing="2" fill="#E8EEF5">PATRICK <tspan fill="url(#nameGradB)">PATENAUDE</tspan></text>
  <text x="77" y="190" font-size="16" font-weight="600" letter-spacing="5" fill="#8E9BB0">DÉVELOPPEUR WEB / MOBILE <tspan fill="#22D3EE">FULLSTACK</tspan></text>
  <rect x="78" y="208" width="96" height="3" rx="1.5" fill="#22D3EE"/>

  <!-- ===================== COORDONNÉES (4 lignes, micro-icônes cyan) ===================== -->
  <!-- chaque icône = boîte 24x24 ; scale 1.0 ; texte baseline alignée -->

  <!-- Email -->
  <g transform="translate(78,268)">
    <g fill="#22D3EE"><path d="M2 6.2A2.2 2.2 0 0 1 4.2 4h15.6A2.2 2.2 0 0 1 22 6.2v.5l-10 6.05L2 6.7v-.5zM2 8.95V17.8A2.2 2.2 0 0 0 4.2 20h15.6a2.2 2.2 0 0 0 2.2-2.2V8.95l-9.48 5.74a1 1 0 0 1-1.04 0L2 8.95z"/></g>
    <text x="40" y="18" font-size="24" font-weight="500" fill="#E8EEF5" letter-spacing="0.4">ppatenaude@hotmail.fr</text>
  </g>

  <!-- Téléphone -->
  <g transform="translate(78,328)">
    <g fill="#22D3EE"><path d="M6.6 10.9a13.6 13.6 0 0 0 6.5 6.5l2.17-2.17a1 1 0 0 1 1.02-.24 11.5 11.5 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.5 11.5 0 0 0 .58 3.6 1 1 0 0 1-.25 1.02L6.6 10.9z"/></g>
    <text x="40" y="18" font-size="24" font-weight="500" fill="#E8EEF5" letter-spacing="0.4">+1 (450) 808-2321</text>
  </g>

  <!-- LinkedIn -->
  <g transform="translate(78,388)">
    <g fill="#22D3EE"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.27V1.73C24 .77 23.2 0 22.22 0z"/></g>
    <text x="40" y="18" font-size="24" font-weight="500" fill="#E8EEF5" letter-spacing="0.4">in/<tspan fill="#E8EEF5">patrickpatenaude</tspan></text>
  </g>

  <!-- GitHub -->
  <g transform="translate(78,448)">
    <g fill="#22D3EE"><path d="M12 .3a12 12 0 0 0-3.79 23.4c.6.1.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.82.57A12 12 0 0 0 12 .3z"/></g>
    <text x="40" y="18" font-size="24" font-weight="500" fill="#E8EEF5" letter-spacing="0.4">Kamaiko</text>
  </g>

  <!-- séparateur vertical entre coordonnées et QR -->
  <line x1="690" y1="270" x2="690" y2="470" stroke="#8E9BB0" stroke-opacity="0.18" stroke-width="1"/>

  <!-- ===================== QR PLACEHOLDER + label ===================== -->
