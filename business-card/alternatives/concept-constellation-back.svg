      <rect x="110" y="20" width="14" height="14"/>
      <rect x="96" y="34" width="14" height="14"/>
      <rect x="82" y="48" width="14" height="14"/>
      <rect x="124" y="48" width="14" height="14"/>

      <rect x="20" y="82" width="14" height="14"/>
      <rect x="48" y="82" width="14" height="14"/>
      <rect x="82" y="82" width="14" height="14"/>
      <rect x="110" y="82" width="14" height="14"/>
      <rect x="138" y="82" width="14" height="14"/>
      <rect x="166" y="82" width="14" height="14"/>

      <rect x="34" y="96" width="14" height="14"/>
      <rect x="68" y="96" width="14" height="14"/>
      <rect x="96" y="96" width="14" height="14"/>
      <rect x="124" y="96" width="14" height="14"/>
      <rect x="152" y="96" width="14" height="14"/>

      <rect x="20" y="110" width="14" height="14"/>
      <rect x="48" y="110" width="14" height="14"/>
      <rect x="82" y="110" width="14" height="14"/>
      <rect x="110" y="110" width="14" height="14"/>
      <rect x="138" y="110" width="14" height="14"/>
      <rect x="166" y="110" width="14" height="14"/>

      <rect x="82" y="124" width="14" height="14"/>
      <rect x="110" y="124" width="14" height="14"/>
      <rect x="152" y="124" width="14" height="14"/>

      <rect x="82" y="138" width="14" height="14"/>
      <rect x="124" y="138" width="14" height="14"/>
      <rect x="152" y="138" width="14" height="14"/>
      <rect x="166" y="138" width="14" height="14"/>

      <rect x="96" y="152" width="14" height="14"/>
      <rect x="124" y="152" width="14" height="14"/>
      <rect x="152" y="152" width="14" height="14"/>

      <rect x="82" y="166" width="14" height="14"/>
      <rect x="110" y="166" width="14" height="14"/>
      <rect x="138" y="166" width="14" height="14"/>
      <rect x="166" y="166" width="14" height="14"/>
