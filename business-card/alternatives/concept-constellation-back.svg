  <!-- label sous le QR -->
  <text x="900" y="488" font-size="20" font-weight="600" letter-spacing="2" fill="#E8EEF5" text-anchor="middle">patenaude.pages.dev</text>
  <text x="900" y="514" font-size="13" font-weight="500" letter-spacing="3" fill="#8E9BB0" text-anchor="middle">SCAN · PORTFOLIO</text>

  <!-- ===================== PIED : logo + glyphe constellation ===================== -->
  <g transform="translate(78,540)">
    <g id="logo-placeholder"><line x1="20" y1="78" x2="80" y2="78" stroke="#22D3EE" stroke-width="4"/><line x1="20" y1="78" x2="50" y2="22" stroke="#22D3EE" stroke-width="4"/><line x1="80" y1="78" x2="50" y2="22" stroke="#22D3EE" stroke-width="4"/><circle cx="50" cy="22" r="9" fill="#22D3EE"/><circle cx="20" cy="78" r="7" fill="#E8EEF5"/><circle cx="80" cy="78" r="7" fill="#E8EEF5"/></g>
