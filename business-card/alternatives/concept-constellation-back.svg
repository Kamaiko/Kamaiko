<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 675" width="1125" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="nameGradB" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="depthGlowB" cx="0.78" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond plein cadre -->
  <rect width="1125" height="675" fill="#0A0E1A"/>
  <rect width="1125" height="675" fill="url(#depthGlowB)"/>

  <!-- ===================== CHAMP DE CONSTELLATION (décor léger) ===================== -->
  <g fill="#E8EEF5">
    <circle cx="60" cy="54" r="0.9" fill-opacity="0.16"/>
    <circle cx="180" cy="40" r="1" fill-opacity="0.20"/>
    <circle cx="300" cy="80" r="0.8" fill-opacity="0.15"/>
    <circle cx="470" cy="44" r="0.9" fill-opacity="0.18"/>
    <circle cx="640" cy="64" r="0.8" fill-opacity="0.14"/>
    <circle cx="1080" cy="58" r="1" fill-opacity="0.20"/>
    <circle cx="40" cy="320" r="0.9" fill-opacity="0.16"/>
    <circle cx="1094" cy="360" r="0.9" fill-opacity="0.18"/>
    <circle cx="52" cy="540" r="0.8" fill-opacity="0.15"/>
    <circle cx="220" cy="640" r="0.9" fill-opacity="0.16"/>
    <circle cx="470" cy="650" r="0.8" fill-opacity="0.14"/>
    <circle cx="700" cy="636" r="0.9" fill-opacity="0.16"/>
    <circle cx="1086" cy="618" r="0.9" fill-opacity="0.18"/>
  </g>

  <!-- cluster coin haut-gauche -->
  <g>
    <g stroke="#22D3EE" stroke-width="1" fill="none">
      <line x1="50" y1="70" x2="150" y2="48" stroke-opacity="0.26"/>
      <line x1="150" y1="48" x2="120" y2="150" stroke-opacity="0.22"/>
      <line x1="50" y1="70" x2="120" y2="150" stroke-opacity="0.15"/>
      <line x1="150" y1="48" x2="240" y2="92" stroke-opacity="0.16"/>
    </g>
    <g>
      <circle cx="150" cy="48" r="3" fill="#22D3EE"/>
      <circle cx="50" cy="70" r="2.4" fill="#22D3EE" fill-opacity="0.8"/>
      <circle cx="120" cy="150" r="2.2" fill="#3B82F6"/>
      <circle cx="240" cy="92" r="1.8" fill="#E8EEF5" fill-opacity="0.5"/>
      <circle cx="150" cy="48" r="9" fill="url(#starGlowB)"/>
    </g>
  </g>

  <!-- cluster coin bas-droit (autour du QR, décoratif) -->
  <g>
    <g stroke="#22D3EE" stroke-width="1" fill="none">
      <line x1="1060" y1="560" x2="980" y2="630" stroke-opacity="0.22"/>
      <line x1="1060" y1="560" x2="1100" y2="640" stroke-opacity="0.16"/>
    </g>
    <g>
      <circle cx="1060" cy="560" r="2.6" fill="#22D3EE" fill-opacity="0.8"/>
      <circle cx="980" cy="630" r="2" fill="#3B82F6" fill-opacity="0.7"/>
      <circle cx="1100" cy="640" r="1.8" fill="#E8EEF5" fill-opacity="0.45"/>
