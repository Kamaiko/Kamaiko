      <rect x="20" y="132" width="48" height="48" rx="4"/>
      <rect x="30" y="142" width="28" height="28" rx="2" fill="#E8EEF5"/>
      <rect x="37" y="149" width="14" height="14" rx="1"/>

      <!-- modules dispersés (trame data, ~22px pas) -->
