<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 675" width="1125" height="675" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Dégradé du panneau : cyan -> bleu (écho au recto) -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelDepth" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0E1A" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <!-- ===== FOND ===== -->
  <rect width="1125" height="675" fill="#0A0E1A"/>
  <ellipse cx="720" cy="340" rx="520" ry="380" fill="url(#glow)"/>

  <!-- ===== PANNEAU GAUCHE (écho au recto, full-bleed, ~37%) : accueille le QR ===== -->
  <g>
    <rect x="0" y="0" width="418" height="675" fill="url(#panelGrad)"/>
    <rect x="0" y="0" width="418" height="675" fill="url(#panelDepth)"/>
    <rect x="414" y="0" width="4" height="675" fill="#0A0E1A" fill-opacity="0.45"/>
  </g>

  <!-- QR placeholder : panneau clair arrondi + trame grossière de carrés sombres -->
  <!-- carré de 210, centré sur x=209, y=255 -> coin (104,150) -->
  <g>
    <rect x="92" y="138" width="234" height="234" rx="20" fill="#E8EEF5"/>
    <!-- trame 7x7 de modules sombres (placeholder ; vrai QR injecté ensuite) -->
    <g fill="#0A0E1A">
      <!-- ligne 1 -->
      <rect x="118" y="164" width="22" height="22"/><rect x="146" y="164" width="22" height="22"/><rect x="174" y="164" width="22" height="22"/><rect x="230" y="164" width="22" height="22"/><rect x="258" y="164" width="22" height="22"/><rect x="286" y="164" width="22" height="22"/>
      <!-- ligne 2 -->
      <rect x="118" y="192" width="22" height="22"/><rect x="174" y="192" width="22" height="22"/><rect x="202" y="192" width="22" height="22"/><rect x="286" y="192" width="22" height="22"/>
      <!-- ligne 3 -->
      <rect x="118" y="220" width="22" height="22"/><rect x="146" y="220" width="22" height="22"/><rect x="202" y="220" width="22" height="22"/><rect x="258" y="220" width="22" height="22"/><rect x="286" y="220" width="22" height="22"/>
      <!-- ligne 4 -->
      <rect x="146" y="248" width="22" height="22"/><rect x="174" y="248" width="22" height="22"/><rect x="230" y="248" width="22" height="22"/><rect x="286" y="248" width="22" height="22"/>
      <!-- ligne 5 -->
      <rect x="118" y="276" width="22" height="22"/><rect x="174" y="276" width="22" height="22"/><rect x="202" y="276" width="22" height="22"/><rect x="230" y="276" width="22" height="22"/><rect x="286" y="276" width="22" height="22"/>
      <!-- ligne 6 -->
      <rect x="118" y="304" width="22" height="22"/><rect x="146" y="304" width="22" height="22"/><rect x="230" y="304" width="22" height="22"/><rect x="258" y="304" width="22" height="22"/>
      <!-- ligne 7 -->
      <rect x="118" y="332" width="22" height="22"/><rect x="174" y="332" width="22" height="22"/><rect x="202" y="332" width="22" height="22"/><rect x="258" y="332" width="22" height="22"/><rect x="286" y="332" width="22" height="22"/>
    </g>
  </g>

  <!-- Label URL, sous le QR, dans le panneau (texte sombre = lisible) -->
  <text x="209" y="430" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="0.5" fill="#0A0E1A">patenaude.pages.dev</text>
  <text x="209" y="460" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="3" fill="#0A0E1A" fill-opacity="0.55">SCAN POUR LE PORTFOLIO</text>

  <!-- ===== ZONE DROITE : EN-TÊTE + CONTACTS ===== -->

  <!-- En-tête : nom (contexte si on ne voit que le verso) -->
  <text x="494" y="142" font-size="27" font-weight="700" letter-spacing="2.5" fill="#E8EEF5">PATRICK <tspan fill="#22D3EE">PATENAUDE</tspan></text>
  <rect x="494" y="160" width="88" height="3" rx="1.5" fill="#22D3EE"/>

  <!-- Contacts : 4 lignes avec micro-icônes cyan -->
  <!-- gabarit : icône à x=494 (24px, scale 1.25 -> 30px), texte à x=540 -->

  <!-- email -->
  <g transform="translate(494,228) scale(1.25)" fill="#22D3EE"><path d="M2 6.2A2.2 2.2 0 0 1 4.2 4h15.6A2.2 2.2 0 0 1 22 6.2v.5l-10 6.05L2 6.7v-.5zM2 8.95V17.8A2.2 2.2 0 0 0 4.2 20h15.6a2.2 2.2 0 0 0 2.2-2.2V8.95l-9.48 5.74a1 1 0 0 1-1.04 0L2 8.95z"/></g>
  <text x="540" y="251" font-size="28" font-weight="500" fill="#E8EEF5" letter-spacing="0.3">ppatenaude@hotmail.fr</text>

  <!-- téléphone -->
  <g transform="translate(494,314) scale(1.25)" fill="#22D3EE"><path d="M6.6 10.9a13.6 13.6 0 0 0 6.5 6.5l2.17-2.17a1 1 0 0 1 1.02-.24 11.5 11.5 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.5 11.5 0 0 0 .58 3.6 1 1 0 0 1-.25 1.02L6.6 10.9z"/></g>
  <text x="540" y="337" font-size="28" font-weight="500" fill="#E8EEF5" letter-spacing="0.3">+1 (450) 808-2321</text>

  <!-- LinkedIn -->
  <g transform="translate(494,400) scale(1.25)" fill="#22D3EE"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.27V1.73C24 .77 23.2 0 22.22 0z"/></g>
  <text x="540" y="423" font-size="28" font-weight="500" fill="#E8EEF5" letter-spacing="0.3">patrickpatenaude</text>

  <!-- GitHub -->
  <g transform="translate(494,486) scale(1.25)" fill="#22D3EE"><path d="M12 .3a12 12 0 0 0-3.79 23.4c.6.1.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.82.57A12 12 0 0 0 12 .3z"/></g>
  <text x="540" y="509" font-size="28" font-weight="500" fill="#E8EEF5" letter-spacing="0.3">Kamaiko</text>

  <!-- Pied : tagline discrète, écho au recto -->
  <line x1="494" y1="556" x2="1050" y2="556" stroke="#E8EEF5" stroke-width="1" stroke-opacity="0.10"/>
  <text x="494" y="598" font-size="16" font-style="italic" font-weight="400" letter-spacing="0.4" fill="#8E9BB0">Humans are harder to debug<tspan fill="#22D3EE" font-style="normal">.</tspan></text>
</svg>
